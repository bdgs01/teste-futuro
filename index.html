<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem de Esperança</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #f5f7fa;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .main-message {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.2;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .input-label {
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #2d3748;
            background: transparent;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }

        input::placeholder, textarea::placeholder {
            color: #a0aec0;
        }

        .button-wrapper {
            margin-top: 16px;
            text-align: right;
        }

        button {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.3);
        }

        .response-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #e0f2fe;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
        }

        .response-message.show {
            display: block;
        }

        .response-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 8px;
        }

        .response-text {
            font-size: 1rem;
            color: #1e3a8a;
            line-height: 1.5;
        }

        .mural-section {
            margin-top: 60px;
        }

        .mural-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
        }

        .mensagens-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .mensagens-lista::-webkit-scrollbar {
            width: 8px;
        }

        .mensagens-lista::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .mensagens-lista::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .mensagem-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            border-left: 3px solid #667eea;
        }

        .mensagem-nome {
            font-size: 0.85rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 6px;
        }

        .mensagem-texto {
            font-size: 0.95rem;
            color: #2d3748;
            line-height: 1.5;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .mensagem-data {
            font-size: 0.8rem;
            color: #718096;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #718096;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .main-message {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            input, textarea {
                font-size: 0.95rem;
            }

            textarea {
                min-height: 90px;
            }

            button {
                width: 100%;
                padding: 16px;
            }

            .button-wrapper {
                text-align: center;
            }

            .mensagens-lista {
                max-height: 400px;
            }

            .mural-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-message">Nós vamos conseguir. Nós podemos!</h1>

        <div class="input-section">
            <div class="input-label">Vamos testar o futuro.</div>

            <div class="input-wrapper">
                <input 
                    type="text"
                    id="userName" 
                    placeholder="Seu nome (opcional)"
                    maxlength="50"
                />
            </div>

            <div class="input-wrapper">
                <textarea 
                    id="userMessage" 
                    placeholder="Digite aqui porquê você acredita..."
                    rows="4"
                ></textarea>
            </div>

            <div class="button-wrapper">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>

        <div id="responseMessage" class="response-message">
            <div class="response-title">Sua mensagem foi enviada!</div>
            <div class="response-text">Ela aparecerá no mural abaixo.</div>
        </div>

        <div class="mural-section">
            <h2 class="mural-title">📝 Mural de Mensagens</h2>
            <div id="mensagensLista" class="mensagens-lista">
                <div class="loading">Carregando mensagens...</div>
            </div>
        </div>
    </div>

    <script>
window.addEventListener('load', buscarMensagens);

async function buscarMensagens() {
    try {
        const response = await fetch('https://a2l1w39msl.execute-api.sa-east-1.amazonaws.com/mensagens');
        const data = await response.json();

        if (data.sucesso && data.mensagens) {
            exibirMensagens(data.mensagens);
        } else {
            document.getElementById('mensagensLista').innerHTML = '<div class="loading">Nenhuma mensagem ainda. Seja o primeiro!</div>';
        }
    } catch (error) {
        document.getElementById('mensagensLista').innerHTML = '<div class="loading">Erro ao carregar mensagens.</div>';
    }
}

function exibirMensagens(mensagens) {
    const lista = document.getElementById('mensagensLista');

    if (mensagens.length === 0) {
        lista.innerHTML = '<div class="loading">Nenhuma mensagem ainda. Seja o primeiro!</div>';
        return;
    }

    lista.innerHTML = '';

    mensagens.forEach(msg => {
        const card = document.createElement('div');
        card.className = 'mensagem-card';

        const dataUTC = new Date(msg.data);
        const dataBrasil = new Date(dataUTC.getTime() - (3 * 60 * 60 * 1000));
        const dataFormatada = dataBrasil.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });

        const nome = msg.nome || 'Anônimo';

        card.innerHTML = `
            <div class="mensagem-nome">${nome}</div>
            <div class="mensagem-texto">${msg.texto}</div>
            <div class="mensagem-data">${dataFormatada}</div>
        `;

        lista.appendChild(card);
    });
}

async function sendMessage() {
    const textarea = document.getElementById('userMessage');
    const inputNome = document.getElementById('userName');
    const message = textarea.value.trim();
    const nome = inputNome.value.trim() || 'Anônimo';

    if (!message) {
        alert('Por favor, digite uma mensagem!');
        return;
    }

    try {
        const response = await fetch('https://a2l1w39msl.execute-api.sa-east-1.amazonaws.com/mensagens', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ texto: message, nome: nome })
        });

        const data = await response.json();

        if (data.sucesso) {
            document.getElementById('responseMessage').classList.add('show');
            textarea.value = '';
            inputNome.value = '';
            await buscarMensagens();

            setTimeout(() => {
                document.querySelector('.mural-section').scrollIntoView({ behavior: 'smooth' });
            }, 300);
        } else {
            alert('Erro ao enviar mensagem.');
        }
    } catch (error) {
        alert('Erro ao enviar mensagem.');
    }
}

document.getElementById('userMessage').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
    </script>
</body>
</html>
