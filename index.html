<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Público</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            color: white;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
        }
        .input-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { opacity: 0.9; }
        .mensagens {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .mensagem {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .mensagem-texto { font-size: 1.1rem; color: #333; margin-bottom: 10px; }
        .mensagem-data { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Mural Público 🌟</h1>
        
        <div class="input-box">
            <textarea id="mensagem" placeholder="Digite sua mensagem..."></textarea>
            <button onclick="enviar()">Enviar Mensagem</button>
        </div>

        <div class="mensagens" id="mensagens">
            <p style="text-align:center; color:#999;">Carregando mensagens...</p>
        </div>
    </div>

    <script>
const API = 'https://a2l1w39msl.execute-api.sa-east-1.amazonaws.com';

async function enviar() {
    const texto = document.getElementById('mensagem').value.trim();
    if (!texto) return alert('Digite uma mensagem!');

    try {
        await fetch(`${API}/mensagem`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto })
        });
        document.getElementById('mensagem').value = '';
        carregar();
    } catch (e) {
        alert('Erro ao enviar!');
    }
}

async function carregar() {
    try {
        const res = await fetch(`${API}/mensagens`);
        const msgs = await res.json();
        
        const html = msgs.map(m => `
            <div class="mensagem">
                <div class="mensagem-texto">${m.texto}</div>
                <div class="mensagem-data">${new Date(m.data).toLocaleString('pt-BR')}</div>
            </div>
        `).join('');
        
        document.getElementById('mensagens').innerHTML = html || '<p style="text-align:center; color:#999;">Nenhuma mensagem ainda.</p>';
    } catch (e) {
        document.getElementById('mensagens').innerHTML = '<p style="text-align:center; color:#f00;">Erro ao carregar mensagens.</p>';
    }
}

carregar();
setInterval(carregar, 5000);
    </script>
</body>
</html>
